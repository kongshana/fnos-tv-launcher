<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launcher</title>
<style>
:root{
  --bg:#080b11;
  --card:#141a24;
  --card-on:#1b2331;
  --text:#e9eef6;
  --dim:#8794a8;
  --line:#1e2734;
  --accent:#3ddc97;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  color:var(--text);display:flex;flex-direction:column;
  user-select:none;-webkit-user-select:none;
  --glow:#1b2331;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%, var(--glow) 0%, transparent 60%);
  opacity:.20;transition:background .35s ease;
}
#home,#appview{position:relative;z-index:1}

/* ---------- 首页 ---------- */
#home{display:flex;flex-direction:column;height:100%}
header{
  display:flex;align-items:center;gap:clamp(20px,2.4vw,46px);
  padding:clamp(18px,2vw,38px) clamp(32px,3.6vw,70px) 0;
}
.brand{font-size:clamp(15px,1.35vw,26px);font-weight:500;letter-spacing:.16em;opacity:.92}
nav{display:flex;gap:clamp(14px,1.5vw,30px);flex:1}
.tab{
  position:relative;padding:clamp(6px,.6vw,11px) clamp(10px,1vw,20px);
  font-size:clamp(15px,1.35vw,26px);color:var(--dim);
  border-radius:clamp(8px,.8vw,14px);cursor:pointer;
  transition:color .2s ease,background .2s ease;
}
.tab.on{color:var(--text);background:rgba(255,255,255,.06)}
.tab.on::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  bottom:clamp(-13px,-.7vw,-6px);width:clamp(18px,1.9vw,34px);
  height:clamp(2px,.25vw,4px);border-radius:2px;background:var(--accent);
}
.clock{font-size:clamp(17px,1.5vw,29px);font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(32px,3.6vw,70px) clamp(8px,.8vw,16px);gap:clamp(16px,1.8vw,34px)}
.hero{
  display:flex;align-items:center;gap:clamp(20px,2.2vw,44px);
  padding:clamp(12px,1.35vw,26px) clamp(22px,2.4vw,46px);
  border-radius:clamp(16px,1.5vw,28px);
  background:linear-gradient(100deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.015) 62%, transparent 100%);
  border:1px solid var(--line);
}
.hero-text{flex:1;display:flex;flex-direction:column;gap:clamp(10px,1vw,20px)}
.hero-title{font-size:clamp(28px,3vw,56px);font-weight:500;line-height:1.1}
.hero-sub{font-size:clamp(14px,1.15vw,22px);color:var(--dim);line-height:1.5;max-width:clamp(320px,34vw,650px)}
.hero-actions{display:flex;gap:clamp(10px,1vw,18px);margin-top:clamp(4px,.4vw,8px)}
.btn{
  border:none;border-radius:clamp(8px,.85vw,16px);cursor:pointer;
  font-family:inherit;font-weight:500;font-size:clamp(14px,1.22vw,23px);
  padding:clamp(9px,.9vw,17px) clamp(20px,2vw,38px);
  transition:transform .15s ease,filter .15s ease;
}
.btn.primary{background:var(--accent);color:#0a0d13}
.btn:hover{transform:translateY(-2px)}
.btn:focus,.btn.on{transform:translateY(-2px) scale(1.04);filter:brightness(1.08);outline:none}
.hero-art{
  flex:0 0 auto;width:clamp(104px,10.4vw,198px);height:clamp(104px,10.4vw,198px);
  border-radius:clamp(20px,2.1vw,40px);display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--accent) 20%, #10151d);
  box-shadow:0 18px 46px rgba(0,0,0,.5);transition:background .3s ease;
}
.hero-art svg{width:52%;height:52%;color:var(--accent)}
.row-wrap{display:flex;flex-direction:column;gap:clamp(10px,1vw,18px)}
.row-title{font-size:clamp(15px,1.32vw,26px);font-weight:500;color:var(--dim);letter-spacing:.05em}
.row{display:flex;gap:clamp(14px,1.5vw,28px)}
.card{
  width:clamp(190px,16.4vw,315px);height:clamp(140px,12.5vw,242px);
  border-radius:clamp(12px,1.2vw,22px);background:var(--card);
  border:3px solid transparent;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(10px,1.05vw,20px);
  cursor:pointer;outline:none;opacity:.78;
  transition:transform .2s ease,background .2s ease,border-color .2s ease,opacity .2s ease,box-shadow .2s ease;
}
.card.on{
  transform:scale(1.08);background:var(--card-on);border-color:var(--accent);opacity:1;
  box-shadow:0 0 0 5px color-mix(in srgb, var(--accent) 20%, transparent),0 18px 40px rgba(0,0,0,.5);
}
.card .glyph{
  width:clamp(68px,6.9vw,134px);height:clamp(68px,6.9vw,134px);
  border-radius:clamp(12px,1.3vw,24px);display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--accent) 22%, transparent);
}
.card .glyph svg{width:56%;height:56%;color:var(--accent)}
.card .name{font-size:clamp(20px,1.9vw,38px);font-weight:500}
footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 clamp(32px,3.6vw,70px) clamp(18px,1.9vw,36px);
  color:var(--dim);font-size:clamp(13px,1.1vw,21px);
}
/* 后台应用提示：应用常驻不销毁，这里告诉用户怎么释放 */
#bgtip{
  display:flex;align-items:center;gap:clamp(6px,.5vw,10px);
  margin:0 clamp(32px,3.6vw,70px) clamp(6px,.5vw,10px);
  padding:clamp(7px,.6vw,12px) clamp(14px,1.2vw,22px);
  border-radius:clamp(8px,.8vw,14px);
  background:rgba(255,255,255,.04);border:1px dashed #2b3444;
  color:#8b98ab;font-size:clamp(12px,1vw,18px);
}
#bgtip[hidden]{display:none}
#bgtip b{color:#c9d4e3;font-weight:500}
kbd{
  display:inline-block;min-width:clamp(22px,1.85vw,35px);
  padding:clamp(2px,.18vw,4px) clamp(6px,.55vw,10px);margin:0 clamp(2px,.18vw,4px);
  border:1px solid #2b3444;border-radius:7px;background:#111721;
  font-family:inherit;font-size:clamp(11px,.95vw,18px);color:#b9c4d4;text-align:center;
}

/* ---------- 应用视图：顶部遥控工具条 + iframe ---------- */
#appview{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:#05070b}
#appview[hidden]{display:none}
#bar{
  display:flex;align-items:center;gap:clamp(8px,.7vw,14px);
  padding:clamp(8px,.7vw,14px) clamp(14px,1.3vw,26px);
  background:rgba(10,14,20,.94);border-bottom:1px solid #1b2331;
  transition:box-shadow .2s ease,background .2s ease;
}
#bar.live{box-shadow:inset 0 0 0 2px var(--accent)}
.bbtn{
  border:2px solid #26303f;border-radius:clamp(8px,.8vw,14px);
  background:#131a24;color:#c9d4e3;font-family:inherit;font-weight:500;
  font-size:clamp(13px,1.05vw,20px);padding:clamp(7px,.6vw,12px) clamp(12px,1.1vw,22px);
  cursor:pointer;outline:none;white-space:nowrap;
  transition:transform .12s ease,border-color .12s ease,background .12s ease,color .12s ease;
}
.bbtn.on{
  transform:scale(1.08);border-color:var(--accent);background:#1d2634;
  color:#fff;box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent);
}
.bbtn:hover{border-color:#3a4757}
.bbtn.wide{flex:0 0 auto}
.spacer{flex:1}
#appname{font-size:clamp(13px,1.1vw,21px);color:var(--dim);font-weight:500}
#hint{
  font-size:clamp(11px,.95vw,18px);color:#6b7788;
}
#framewrap{flex:1;position:relative;background:#000}
.appframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;
  display:none;background:#000;
}
#loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(15px,1.3vw,25px);color:#5d6879;background:#05070b;
}
#loading[hidden]{display:none}

/* ---------- 软键盘 ---------- */
#kbdlg{
  position:fixed;left:50%;bottom:clamp(30px,3vw,60px);transform:translateX(-50%);
  width:min(1180px,92vw);z-index:20;
  background:rgba(9,13,19,.97);border:1px solid #222c3a;border-radius:clamp(14px,1.3vw,24px);
  padding:clamp(14px,1.3vw,26px);box-shadow:0 30px 80px rgba(0,0,0,.7);
}
#kbdlg[hidden]{display:none}
#kbin{
  width:100%;font-family:inherit;font-size:clamp(16px,1.5vw,28px);
  padding:clamp(9px,.85vw,16px) clamp(12px,1.1vw,22px);
  border-radius:clamp(8px,.8vw,14px);border:2px solid #2a3543;
  background:#0d131b;color:#e9eef6;outline:none;margin-bottom:clamp(10px,.9vw,18px);
}
#kbin:focus{border-color:var(--accent)}
#kbcur{font-size:clamp(12px,1vw,18px);color:#8b98ab;margin-bottom:clamp(8px,.7vw,14px);min-height:1.4em}
#kbcur b{color:var(--accent)}
#kbrow{margin-bottom:clamp(10px,.9vw,18px)}
#kbgrid{display:flex;flex-direction:column;gap:clamp(6px,.55vw,11px)}
.kbline{display:flex;gap:clamp(6px,.55vw,11px);justify-content:center}
.kbkey{
  min-width:clamp(38px,5.2vw,100px);padding:clamp(9px,.85vw,17px) 0;
  border:2px solid #26303f;border-radius:clamp(7px,.65vw,12px);
  background:#131a24;color:#dbe4f0;font-family:inherit;
  font-size:clamp(14px,1.25vw,24px);text-align:center;cursor:pointer;outline:none;
  transition:transform .1s ease,border-color .1s ease,background .1s ease;
}
.kbkey.on{
  transform:scale(1.12);border-color:var(--accent);background:#1f2a38;color:#fff;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
}
.kbkey.wide{min-width:clamp(70px,9vw,180px)}
.kbkey.go{background:var(--accent);color:#0a0d13;border-color:var(--accent);font-weight:600}
.kbkey.ok{background:#16241d;border-color:var(--accent);color:var(--accent);font-weight:600}
.kbkey.del{background:#2a1c22;border-color:#4a2f38;color:#ffb3c1}
.kbtip{text-align:center;color:#6b7788;font-size:clamp(11px,.9vw,17px);margin-top:clamp(8px,.7vw,14px)}
</style>
</head>
<body>

<!-- ============ 首页 ============ -->
<div id="home">
  <header>
    <div class="brand">FNOS</div>
    <nav id="tabs"></nav>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <div class="hero-title" id="heroTitle">—</div>
        <div class="hero-sub" id="heroSub">—</div>
        <div class="hero-actions">
          <button class="btn primary" id="btnOpen">打开</button>
        </div>
      </div>
      <div class="hero-art" id="heroArt"></div>
    </section>

    <section class="row-wrap">
      <h2 class="row-title">我的应用</h2>
      <div class="row" id="row"></div>
    </section>
  </main>

  <div id="bgtip" hidden></div>

  <footer>
    <div><kbd>←</kbd><kbd>→</kbd> 选择　<kbd>OK</kbd> / <kbd>回车</kbd> 打开　<kbd>1</kbd>–<kbd>5</kbd> 直达　<kbd>0</kbd> 关闭后台应用　·　不动它就会自动轮播</div>
    <div>点一下顶部工具条 → <kbd>←</kbd><kbd>→</kbd> 选按钮，<kbd>OK</kbd> 执行，<kbd>Esc</kbd> 回桌面</div>
  </footer>
</div>

<!-- ============ 应用视图 ============ -->
<div id="appview" hidden>
  <div id="bar">
    <button class="bbtn" data-act="home">⌂ 回桌面</button>
    <button class="bbtn" data-act="back">← 后退</button>
    <button class="bbtn" data-act="fwd">→ 前进</button>
    <button class="bbtn" data-act="reload">⟲ 刷新</button>
    <button class="bbtn" data-act="kb">⌨ 键盘</button>
    <button class="bbtn" data-act="into">进入应用</button>
    <span class="spacer"></span>
    <span id="appname"></span>
    <span id="hint">　方向键选按钮 · OK 执行 · 网页里按 Esc 回到这条菜单栏 · 再按 Esc 回桌面</span>
  </div>
  <div id="framewrap">
    <!-- 每个应用一个常驻 iframe（由 JS 动态创建）。
         关键：回桌面只隐藏、不销毁，这样影视的登录令牌留在内存里，
         下次进来不用再输账号密码。 -->
    <div id="loading">正在加载…</div>
  </div>
</div>

<!-- ============ 软键盘 ============ -->
<div id="kbdlg" hidden>
  <input id="kbin" type="text" autocomplete="off" spellcheck="false" placeholder="点上面的字符即可输入；在网页输入框里时字会直接打进网页">
  <div id="kbcur" class="kbcur"></div>
  <div id="kbgrid"></div>
  <div class="kbtip">点字符即可输入（飞鼠直接点也行）· 退格删除　·　<b>在网页输入框里时，字会直接打进网页</b>　·　空格 / 清空 / 123 切换，✕ 关闭</div>
</div>

<script>
/* 五个入口。IP 与端口由 install.sh 自动写入；想改应用直接改这里 */
const BASE = 'http://__FNOS_IP__:__FNOS_PORT__';
const APPS = [
  { name:'飞牛影视', sub:'海报墙、剧集与电影，4K 原盘直接播放',
    url:BASE + '/v',     color:'#3ddc97', icon:'video' },
  { name:'飞牛相册', sub:'照片与视频的时间线，按人物和地点整理',
    url:BASE + '/p',     color:'#4aa8ff', icon:'photo' },
  { name:'飞牛音乐', sub:'音乐库、歌单与专辑，支持无损播放',
    url:BASE + '/music', color:'#b98bff', icon:'music' },
  /* 我的文件：自建的本地文件浏览器（见 launcher_web.py 的 /api/list 与 /raw），
     直接读 NAS 数据盘，不需要飞牛登录态。 */
  { name:'我的文件', sub:'浏览 NAS 上的文件夹，看图、播视频、听音乐',
    url:'./files.html', color:'#ffd166', icon:'folder' },
  /* 浏览器不再整页跳转：走同源代理内嵌（见 launcher_web.py），
     顶部菜单栏与浏览器导航栏始终常驻，随时能返回桌面。 */
  { name:'浏览器',   sub:'网页浏览，带地址栏与常用站点，随时返回桌面',
    url:'./nav.html', color:'#ff9f45', icon:'web' }
];

const ICONS = {
  video:'<svg viewBox="0 0 100 100"><path d="M34 22 L34 78 L74 50 Z" fill="currentColor"/></svg>',
  photo:'<svg viewBox="0 0 100 100"><rect x="14" y="24" width="72" height="52" rx="6" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="50" cy="50" r="14" fill="none" stroke="currentColor" stroke-width="7"/><path d="M22 70 L38 52 L52 66 L66 46 L78 62 L78 70 Z" fill="currentColor"/></svg>',
  music:'<svg viewBox="0 0 100 100"><circle cx="36" cy="74" r="14" fill="currentColor"/><circle cx="74" cy="62" r="14" fill="currentColor"/><rect x="46" y="18" width="7" height="56" rx="3" fill="currentColor"/><rect x="84" y="6" width="7" height="56" rx="3" fill="currentColor"/><path d="M46 18 L91 6 L91 20 L53 32 Z" fill="currentColor"/></svg>',
  web:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34" fill="none" stroke="currentColor" stroke-width="7"/><path d="M16 50 H84" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 16 C64 34 64 66 50 84" fill="none" stroke="currentColor" stroke-width="7"/><path d="M50 16 C36 34 36 66 50 84" fill="none" stroke="currentColor" stroke-width="7"/></svg>',
  folder:'<svg viewBox="0 0 100 100"><path d="M8 24 C8 19 12 16 17 16 L38 16 C42 16 45 18 47 21 L51 27 C52 29 55 30 58 30 L83 30 C88 30 92 34 92 39 L92 76 C92 79 88 82 83 82 L17 82 C12 82 8 79 8 76 Z" fill="currentColor"/></svg>'
};

const row  = document.getElementById('row');
const tabs = document.getElementById('tabs');
const heroTitle = document.getElementById('heroTitle');
const heroSub   = document.getElementById('heroSub');
const heroArt   = document.getElementById('heroArt');
const btnOpen   = document.getElementById('btnOpen');
const homeEl    = document.getElementById('home');
const appEl     = document.getElementById('appview');
const framewrap = document.getElementById('framewrap');
const loading   = document.getElementById('loading');
const bar       = document.getElementById('bar');
const appnameEl = document.getElementById('appname');
const kbdlg     = document.getElementById('kbdlg');
const kbin      = document.getElementById('kbin');
const kbgrid    = document.getElementById('kbgrid');
const kbcur     = document.getElementById('kbcur');
const bgtip     = document.getElementById('bgtip');

/* mode: home(选应用) | bar(工具条) | kb(软键盘) | app(焦点交给应用) */
let mode  = 'home';
let cur   = 0;
let curApp = -1;
let justOpenedAt = 0;      // 刚打开应用的时刻，用来吃掉同一按键的“余波”

/* ---------- 首页：应用卡片与标签 ---------- */
APPS.forEach((app, i) => {
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.textContent = app.name;
  tab.style.setProperty('--accent', app.color);
  tab.addEventListener('mouseenter', () => { if (mode === 'home') selectApp(i); });
  tab.addEventListener('click', () => openApp(i));
  tabs.appendChild(tab);

  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--accent', app.color);
  el.innerHTML =
    '<div class="glyph">' + ICONS[app.icon] + '</div>' +
    '<div class="name">' + app.name + '</div>';
  el.addEventListener('mouseenter', () => { if (mode === 'home') selectApp(i); });
  el.addEventListener('click', () => openApp(i));
  row.appendChild(el);
});

function selectApp(i){
  cur = i;
  const a = APPS[i];
  [...row.children].forEach((c, n) => c.classList.toggle('on', n === i));
  [...tabs.children].forEach((c, n) => c.classList.toggle('on', n === i));
  heroTitle.textContent = a.name;
  heroSub.textContent   = a.sub;
  heroArt.innerHTML     = ICONS[a.icon];
  document.body.style.setProperty('--glow', a.color);
  document.body.style.setProperty('--accent', a.color);
  btnOpen.style.background = a.color;
}
function moveHome(d){ selectApp((cur + d + APPS.length) % APPS.length); }

/* ---------- 首页慢速轮播 ----------
   开机进来没人操作时，5 个入口依次自动高亮（连同大图与配色一起换），
   一旦有按键/鼠标动作就停下，空闲一会儿再接着转。 */
const ROTATE_MS     = 3000;    // 3 秒换一个
const IDLE_RESUME   = 20000;   // 停手 20 秒后重新接管
let rotTimer = null, idleTimer = null;

function startRotate(){
  stopRotate();
  if (mode !== 'home') return;
  rotTimer = setInterval(() => { if (mode === 'home') moveHome(1); }, ROTATE_MS);
}
function stopRotate(){
  if (rotTimer) { clearInterval(rotTimer); rotTimer = null; }
  clearTimeout(idleTimer); idleTimer = null;
}
function nudge(){                       // 用户一动：暂停，稍后再续
  stopRotate();
  idleTimer = setTimeout(() => { if (mode === 'home') startRotate(); }, IDLE_RESUME);
}
['keydown', 'pointerdown', 'mousemove', 'wheel', 'touchstart'].forEach(ev => {
  window.addEventListener(ev, () => { if (mode === 'home') nudge(); }, { passive:true });
});

/* ---------- 应用视图 ----------
   每个应用一个 iframe，第一次打开时创建，之后一直常驻（切走只是 display:none）。
   这样影视/相册的登录态、页面位置都留在内存里，回桌面再进来不用重新登录。 */
const frames = [];        // APPS 下标 -> iframe
let curFrame = null;

function ensureFrame(i){
  if (frames[i]) return frames[i];
  const f = document.createElement('iframe');
  f.className = 'appframe';
  f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
  f.setAttribute('allowfullscreen', '');
  f.addEventListener('load', () => {
    if (curFrame === f) loading.hidden = true;
    flushPendingNav(f);
    if (mode === 'bar') { try { window.focus(); } catch (e) {} }
  });
  f.addEventListener('click', () => { if (mode !== 'kb') setMode('app'); });
  loading.hidden = false;
  f.src = APPS[i].url;
  framewrap.appendChild(f);
  frames[i] = f;
  /* 兜底：8 秒还没 load 完就收起遮罩，避免一直卡在“正在加载” */
  setTimeout(() => { if (curFrame === f) loading.hidden = true; }, 8000);
  return f;
}
function showFrame(i){
  frames.forEach((f, n) => { if (f) f.style.display = (n === i) ? 'block' : 'none'; });
  curFrame = frames[i] || null;
}

function openApp(i){
  const a = APPS[i];
  if (curApp !== i) hideKb();
  curApp = i;
  justOpenedAt = performance.now();     // 防呆：刚打开的这一下按键别再被执行一次
  selectApp(i);
  if (a.external) {                       // 外部站点：整页打开，按返回键回启动器
    window.location.href = a.url;
    return;
  }
  homeEl.hidden = true;
  appEl.hidden  = false;
  appnameEl.textContent = a.name;
  document.body.style.setProperty('--accent', a.color);
  const fresh = !frames[i];
  ensureFrame(i);
  showFrame(i);
  if (!fresh) loading.hidden = true;      // 已常驻的页面不再显示加载遮罩
  setMode('bar');
}
/* 回桌面：只隐藏窗口，绝不销毁 iframe —— 登录态就靠这一点保住 */
function goHome(){
  appEl.hidden = true;
  homeEl.hidden = false;
  hideKb();
  setMode('home');
  refreshBgTip();
  window.focus();
}
/* 后台还留着的应用，提示用户按 0 释放（省内存、也把视频声音停掉） */
function refreshBgTip(){
  const alive = [];
  for (let i = 0; i < frames.length; i++) if (frames[i]) alive.push(i);
  if (mode !== 'home' || !alive.length) { bgtip.hidden = true; return; }
  bgtip.innerHTML = '后台运行中：<b>' + alive.map(i => APPS[i].name).join('、') +
    '</b>　·　按 <kbd>0</kbd> 全部关闭（同时停掉视频声音、释放内存）·　按 <kbd>1</kbd>–<kbd>5</kbd> 可回到其中任意一个';
  bgtip.hidden = false;
}
function closeAllFrames(){
  for (let i = 0; i < frames.length; i++) {
    const f = frames[i];
    if (!f) continue;
    try { f.src = 'about:blank'; f.remove(); } catch (e) {}
    frames[i] = null;
  }
  curFrame = null;
  curApp = -1;
  loading.hidden = true;
  refreshBgTip();
}
function frameWin(){ try { return curFrame ? curFrame.contentWindow : null; } catch (e) { return null; } }
/* 浏览器应用：它自己内部还有一层网页 iframe，前进/后退/刷新要穿透一层 */
function navWin(){
  try {
    const w = curFrame && curFrame.contentWindow;
    return (w && typeof w.navGo === 'function') ? w : null;
  } catch (e) { return null; }
}
function goBack(){
  const n = navWin();
  if (n) { try { n.navBack(); } catch (e) {} return; }
  const w = frameWin(); if (w) { try { w.history.back(); } catch (e) {} }
}
function goFwd(){
  const n = navWin();
  if (n) { try { n.navFwd(); } catch (e) {} return; }
  const w = frameWin(); if (w) { try { w.history.forward(); } catch (e) {} }
}
function reloadPage(){
  const n = navWin();
  if (n) { try { n.navReload(); } catch (e) {} return; }
  if (!curFrame) return;
  const f = curFrame;
  loading.hidden = false;
  const u = f.src;
  f.src = 'about:blank';
  setTimeout(() => { f.src = u; }, 120);
}
function intoApp(){
  const w = frameWin();
  if (w) { try { w.focus(); } catch (e) {} }
  setMode('app');
}

/* ---------- 工具条 ---------- */
const barBtns = [...bar.querySelectorAll('.bbtn')];
let barIdx = 0;
function setBarFocus(i){
  barIdx = Math.max(0, Math.min(barBtns.length - 1, i));
  barBtns.forEach((b, n) => b.classList.toggle('on', n === barIdx));
}
barBtns.forEach((b, n) => {
  b.addEventListener('mouseenter', () => { if (mode === 'bar') setBarFocus(n); });
  b.addEventListener('click', () => { setBarFocus(n); runBar(barBtns[barIdx].dataset.act); });
});
function runBar(act){
  switch (act) {
    case 'home':   goHome(); break;
    case 'back':   goBack(); break;
    case 'fwd':    goFwd(); break;
    case 'reload': reloadPage(); break;
    case 'kb':     showKb(); break;
    case 'into':   intoApp(); break;
  }
}
/* 把键盘焦点抢回顶层文档。
   应用 iframe 常驻之后，焦点容易留在应用里，导致从首页按 OK/回车打开应用时
   那一下按键被应用误收（比如直接触发影视的“登录”校验）。 */
function grabFocus(){
  try {
    const ae = document.activeElement;
    if (ae && ae !== document.body && ae.tagName !== 'INPUT') ae.blur();
    document.body.focus({ preventScroll: true });
  } catch (e) {}
  try { window.focus(); } catch (e) {}
}

function setMode(m){
  mode = m;
  bar.classList.toggle('live', m === 'bar');
  const onBar = (m === 'bar');
  barBtns.forEach((b, n) => b.classList.toggle('on', onBar && n === barIdx));
  btnOpen.classList.toggle('on', m === 'home');
  [...row.children].forEach((c, n) => c.classList.toggle('on', m === 'home' && n === cur));
  if (m === 'bar' || m === 'home') grabFocus();
  if (m === 'home') startRotate(); else stopRotate();
}

/* ---------- 软键盘 ---------- */
const KB_ABC = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l','-'],
  ['z','x','c','v','b','n','m','.',',','/']
];
const KB_123 = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['@','.','-','_',':','/','?','&','=','+'],
  ['(',')','*','#','%','~','!','$',"'",'"']
];
let kbSet = 'abc';
let kbRows = [];      // 每行的 DOM 按钮数组
let kbR = 0, kbC = 0;

function buildKb(){
  const layout = kbSet === 'abc' ? KB_ABC : KB_123;
  kbgrid.innerHTML = '';
  kbRows = layout.map(line => {
    const d = document.createElement('div');
    d.className = 'kbline';
    const cells = line.map(ch => {
      const b = document.createElement('div');
      b.className = 'kbkey';
      b.textContent = ch;
      b.dataset.ch = ch;
      b.addEventListener('mouseenter', () => {
        if (mode !== 'kb') return;
        kbR = kbRows.indexOf(cells); kbC = cells.indexOf(b); paintKb();
      });
      b.addEventListener('click', () => typeChar(ch));
      d.appendChild(b);
      return b;
    });
    kbgrid.appendChild(d);
    return cells;
  });
  // 功能行（TV 风格：没有单独的“输入”键 —— OK/回车 直接把高亮的字符打进输入框）
  const d = document.createElement('div');
  d.className = 'kbline';
  const func = [
    { label:'空格', cls:'wide', fn: () => typeChar(' ') },
    { label:'⌫ 退格', cls:'wide del', fn: kbBackspace },
    { label:'清空', cls:'', fn: kbClear },
    { label: kbSet === 'abc' ? '123' : 'ABC', cls:'', fn: () => { kbSet = kbSet === 'abc' ? '123' : 'abc'; buildKb(); paintKb(); } },
    { label:'✕ 关闭', cls:'', fn: hideKb }
  ];
  const cells = func.map(f => {
    const b = document.createElement('div');
    b.className = 'kbkey ' + f.cls;
    b.textContent = f.label;
    b.addEventListener('mouseenter', () => {
      if (mode !== 'kb') return;
      kbR = kbRows.length - 1; kbC = cells.indexOf(b); paintKb();
    });
    b.addEventListener('click', f.fn);
    d.appendChild(b);
    return b;
  });
  kbgrid.appendChild(d);
  kbRows.push(cells);
}
function paintKb(){
  let cur = null;
  kbRows.forEach((line, r) => line.forEach((b, c) => {
    const on = (r === kbR && c === kbC);
    b.classList.toggle('on', on);
    if (on) cur = b;
  }));
  /* 提示当前确认键会执行什么：高亮在字符上→输入该字符；在高亮功能键上→执行该功能 */
  if (cur) {
    kbcur.textContent = cur.dataset.ch
      ? ('点「' + cur.dataset.ch + '」即输入')
      : cur.textContent;
  } else {
    kbcur.textContent = '';
  }
}
/* 当前是不是「浏览器」应用，而且网页里有个输入框正聚焦着？
   是的话，软键盘的字要直接打进网页，而不是只写进我们自己的地址栏。 */
function webKb(){
  const n = navWin();
  if (!n || typeof n.webHasInput !== 'function') return null;
  try { return n.webHasInput() ? n : null; } catch (e) { return null; }
}
function syncFromWeb(n){
  try {
    const v = n && n.webValue ? n.webValue() : null;
    if (typeof v === 'string') {
      kbin.value = v;
      kbin.setSelectionRange(kbin.value.length, kbin.value.length);
    }
  } catch (e) {}
}
/* 软键盘改为“点哪打哪、直接进网页”的通用输入法：
   1) 网页输入框聚焦时，点一下字符就把字直接打进网页（代理页 __launcherType 只改 value 不抢焦点，飞鼠可用）；
   2) 否则写进我们自己的输入框；若键盘是从导航栏地址框弹出来的，再同步回地址框，
      这样关掉键盘后点导航栏的「前往」仍可导航。
   不再有“前往→浏览器搜索”的跳转——提交交给网页自己的按钮。 */
let kbForAddr = false;
function mirrorAddr(){
  if (!kbForAddr) return;
  try {
    const w = frameWin();
    const a = w && w.document && w.document.getElementById('addr');
    if (a) a.value = kbin.value;
  } catch (e) {}
}
function typeChar(ch){
  const n = webKb();
  if (n) { try { n.webType(ch); syncFromWeb(n); } catch (e) {} return; }
  kbin.value += ch;
  mirrorAddr();
  kbin.focus();
  kbin.setSelectionRange(kbin.value.length, kbin.value.length);
}
function kbBackspace(){
  const n = webKb();
  if (n) { try { n.webBack(); syncFromWeb(n); } catch (e) {} return; }
  kbin.value = kbin.value.slice(0, -1);
  mirrorAddr();
  kbin.focus();
  kbin.setSelectionRange(kbin.value.length, kbin.value.length);
}
function kbClear(){
  const n = webKb();
  if (n) { try { n.webClear(); syncFromWeb(n); } catch (e) {} return; }
  kbin.value = '';
  mirrorAddr();
  kbin.focus();
}
/* 统一入口：切到浏览器应用并在其中打开网址 */
let pendingNav = null;      // 浏览器应用还没加载好时先记下来，load 完再送进去
function navTo(url){
  const bi = APPS.findIndex(a => a.name === '浏览器');
  if (bi < 0) { window.location.href = url; return; }
  if (curApp !== bi) openApp(bi);
  const w = frameWin();
  if (w && typeof w.navGo === 'function') { w.navGo(url); setMode('bar'); }
  else pendingNav = url;      // 绝不用整页跳转，否则就脱离启动器了
}
function flushPendingNav(f){
  if (!pendingNav) return;
  try {
    if (f.contentWindow && typeof f.contentWindow.navGo === 'function') {
      const u = pendingNav; pendingNav = null;
      f.contentWindow.navGo(u);
    }
  } catch (e) {}
}
function showKb(){
  if (!kbRows.length) buildKb();
  kbdlg.hidden = false;
  kbR = 0; kbC = 0; paintKb();
  setMode('kb');
  const n = webKb();
  if (n) syncFromWeb(n);          // 网页输入框里已有的字，同步显示进来
  /* 关键：点网页输入框自动弹键盘时，焦点还在 iframe 里，
     不抢回顶层的话，方向键和 OK 会漏进网页（实测直接把必应的搜索提交了）。 */
  grabFocus();
  setTimeout(() => kbin.focus(), 30);
}
function hideKb(){ kbdlg.hidden = true; if (mode === 'kb') setMode('bar'); }

function moveKb(dx, dy){
  kbR = Math.max(0, Math.min(kbRows.length - 1, kbR + dy));
  if (kbRows[kbR]) kbC = Math.max(0, Math.min(kbRows[kbR].length - 1, kbC + dx));
  paintKb();
}

/* ---------- 键盘 / 遥控器导航 ---------- */
document.addEventListener('keydown', e => {
  const k = e.key;

  if (mode === 'kb') {
    switch (k) {
      case 'ArrowRight': moveKb(1, 0);   e.preventDefault(); return;
      case 'ArrowLeft':  moveKb(-1, 0);  e.preventDefault(); return;
      case 'ArrowDown':  moveKb(0, 1);   e.preventDefault(); return;
      case 'ArrowUp':    moveKb(0, -1);  e.preventDefault(); return;
      case 'Enter': case ' ': case 'OK': case 'Select': case 'Accept': case 'Confirm': {
        const b = kbRows[kbR] && kbRows[kbR][kbC];
        if (b) b.click();
        e.preventDefault(); return;
      }
      case 'Backspace': kbBackspace(); e.preventDefault(); return;
      case 'Escape': case 'ContextMenu': hideKb(); e.preventDefault(); return;
    }
    return;   // 软键盘打开时其它键交给输入框
  }

  if (mode === 'bar') {
    /* 刚从首页打开应用时，同一下回车很容易被再执行一遍（工具条第一项正好是“回桌面”），
       于是应用一闪就退回桌面。这里把 350ms 内的回车吃掉。 */
    if (performance.now() - justOpenedAt < 350 &&
        (k === 'Enter' || k === ' ' || k === 'OK' || k === 'Select')) {
      e.preventDefault(); return;
    }
    switch (k) {
      case 'ArrowRight': setBarFocus(barIdx + 1); e.preventDefault(); return;
      case 'ArrowLeft':  setBarFocus(barIdx - 1); e.preventDefault(); return;
      case 'Enter': case ' ': case 'OK': case 'Select': case 'Accept': case 'Confirm':
        runBar(barBtns[barIdx].dataset.act); e.preventDefault(); return;
      case 'ArrowDown': intoApp(); e.preventDefault(); return;
      case 'Escape': case 'ContextMenu': goHome(); e.preventDefault(); return;
      case 'BrowserBack': goBack(); e.preventDefault(); return;
      case 'Backspace': goBack(); e.preventDefault(); return;
    }
    if (/^[1-9]$/.test(k)) { const i = +k - 1; if (i < APPS.length) { openApp(i); e.preventDefault(); } }
    return;
  }

  if (mode === 'home') {
    switch (k) {
      case 'ArrowRight': case 'ArrowDown': moveHome(1);  e.preventDefault(); return;
      case 'ArrowLeft':  case 'ArrowUp':   moveHome(-1); e.preventDefault(); return;
      case 'Enter': case ' ': case 'OK': case 'Select': case 'Accept': case 'Confirm': openApp(cur); e.preventDefault(); return;
    }
    if (k === '0') { closeAllFrames(); e.preventDefault(); return; }   // 关掉后台应用
    if (/^[1-9]$/.test(k) && +k <= APPS.length) { selectApp(+k - 1); e.preventDefault(); }
    return;
  }

  /* mode === 'app'：焦点在应用里，浏览器不会把按键送到这里，
     所以这里只作为兜底（用鼠标点过工具条之后才会走到）。 */
});

/* 用鼠标点了工具条区域 -> 收回键盘焦点到本页 */
bar.addEventListener('mousedown', () => { if (mode !== 'kb') setMode('bar'); });

/* ---------- 来自 iframe 的消息（浏览器导航页 / 被代理的网页） ---------- */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  if (d.__launcherAct === 'home') { goHome(); return; }

  if (d.__launcherKb) {                       // 浏览器导航栏请求软键盘（来自地址框）
    const bi = APPS.findIndex(a => a.name === '浏览器');
    if (bi >= 0 && curApp !== bi) openApp(bi);
    kbin.value = d.__launcherKb.value || '';
    kbForAddr = true; mirrorAddr();
    showKb();
    return;
  }

  if (d.__launcherKbNeed) {                   // 网页里点了输入框，自动弹键盘（来自网页输入框）
    const bi = APPS.findIndex(a => a.name === '浏览器');
    if (bi >= 0 && curApp !== bi) return;
    kbForAddr = false;
    if (kbdlg.hidden) showKb();
    return;
  }

  const k = d.__launcherKey;
  if (!k) return;
  if (k === 'Escape' || k === 'ContextMenu') {
    setMode('bar'); window.focus();                 // 焦点收回菜单栏
  } else if (k === 'Backspace' || k === 'BrowserBack' || k === 'GoBack') {
    goBack(); setMode('bar'); window.focus();
  } else if (k === 'ArrowUp') {
    setMode('bar'); window.focus();
  }
});

btnOpen.addEventListener('click', () => openApp(cur));

/* 无窗口管理器时窗口可能未激活，主动抢一次焦点，保证键盘可用 */
document.body.setAttribute('tabindex', '-1');
grabFocus();
document.addEventListener('DOMContentLoaded', () => {
  document.body.setAttribute('tabindex', '-1');
  grabFocus();
});

function tick(){
  const d = new Date();
  document.getElementById('clock').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick, 20000);
selectApp(0);
setBarFocus(0);
buildKb();
startRotate();          /* 开机就进入轮播，按任意键接管 */

/* 排错用：远程看一眼当前处于哪个模式（不影响正常使用） */
window.__launcherState = function(){
  return { mode: mode, cur: cur, curApp: curApp, barIdx: barIdx,
           appHidden: appEl.hidden, homeHidden: homeEl.hidden };
};

/* 把当前逻辑(CSS)分辨率写进窗口标题，方便远程排查缩放是否正确 */
function setTitle(){
  document.title = 'Launcher ' + window.innerWidth + 'x' + window.innerHeight
    + ' @' + (window.devicePixelRatio || 1) + 'x';
}
setTitle();
window.addEventListener('resize', setTitle);
</script>

</body>
</html>
